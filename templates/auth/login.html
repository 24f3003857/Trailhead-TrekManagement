{% extends "base.html" %}
{% block title %}Log in{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="panel">
            <h3 class="page-title">Log in</h3>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-trail w-100">Log in</button>
            </form>

            <hr class="my-4">
            <p class="small text-muted mb-1">
                New User? <a href="{{ url_for('auth.register') }}">Create an account!</a>
            </p>
            <p class="small text-muted mb-0">
                Want to be a guide? <a href="{{ url_for('auth.register_staff') }}">We will let you know soon :D </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
